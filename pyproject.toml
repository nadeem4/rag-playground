[project]
name = "rag-playground"
version = "0.1.0"
description = "A local-first bench for learning and demonstrating RAG by experiment"
requires-python = ">=3.13,<3.14"
dependencies = [
    "docling>=2.129.0",
    "fastapi>=0.141.1",
    "lancedb>=0.38,<0.39",
    "pydantic>=2.9",
    "pypdfium2>=5.13.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
rag-playground = "api.cli:main"

[project.optional-dependencies]
dev = [
    "httpx2>=2.13.0",
    "pytest>=8.3",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: requires downloaded ML models (deselected by default)"]
addopts = "-m 'not models'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "providers", "plugins", "api"]
