<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0f6e51" />
    <title>RAG Playground</title>
    <script>
      // Apply a pinned theme before first paint. "system" leaves data-theme
      // unset so prefers-color-scheme decides. Storage can throw; ignore it.
      try {
        var t = localStorage.getItem("rag-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        if (localStorage.getItem("rag-contrast") === "more") document.documentElement.dataset.contrast = "more";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
