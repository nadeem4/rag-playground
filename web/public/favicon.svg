<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- A chunk map, the app's own mark: three chunks of the sample document on the off-black surface.
       Fills are chunk-1, chunk-2 and chunk-3 from tokens.css at their dark-theme lightness. -->
