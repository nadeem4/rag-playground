# Changelog config for CHANGELOG.md, packages/pandion/CHANGELOG.md and
# packages/pandion-api/CHANGELOG.md. It copies the commit_parsers of cliff.toml and adds
# a header and a per-version body. cliff.toml drives the release version and is never
# changed for this. The tag pattern and the path filter are passed per file on the
# command line; the commands are in CONTRIBUTING.md, "Changelogs".

[changelog]
header = """
# Changelog

Notable changes, newest release first, commits oldest first within a release. \
Releases with only housekeeping commits (docs, chore, test, ci, refactor) are not listed. \
A commit that touches several parts appears in each part's changelog.

Generated by git-cliff from Conventional Commit titles. See CONTRIBUTING.md to regenerate it.

"""
body = """
{% if version %}\
## v{{ version | split(pat="v") | last }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
topo_order = true
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Faster" },
  { message = "^(docs|chore|test|ops|ci|refactor|style|build)", skip = true },
]
sort_commits = "oldest"
