[project]
name = "pandion"
version = "0.3.0"
description = "Retrieval pipelines you can inspect, step by step"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nadeem Khan" }]
requires-python = ">=3.13,<3.14"
keywords = ["retrieval", "rag", "search", "embeddings", "pdf", "chunking", "reranking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]
dependencies = ["pydantic>=2.9", "pyyaml>=6.0.3"]

# Parsers, models and stores are extras, so the base install stays small.
# A step whose extra is missing says which one to install.
[project.optional-dependencies]
pdfium = ["pypdfium2>=5.13.0"]
docling = [
    "docling>=2.129.0",
    # Docling's OCR engine. RapidOCR's ONNX checkpoints ship inside its wheel,
    # so OCR downloads nothing; without onnxruntime Docling falls back to
    # RapidOCR's torch backend, which fetches .pth files into site-packages.
    "onnxruntime>=1.30.0",
]
# Local models: the embedders, the cross-encoder and mmr. On Linux the root
# pyproject.toml takes torch from the CPU-only index.
local = ["sentence-transformers>=6.1.0", "torch>=2.14.0"]
lancedb = ["lancedb>=0.38,<0.39", "pyarrow>=25.0.1"]
# Chat models, for llm_rewrite: OpenAI, OpenRouter and any OpenAI-compatible
# server through the OpenAI SDK, and Claude through the Anthropic SDK.
openai = ["openai>=3.17.0"]
anthropic = ["anthropic>=1.7.0"]

[project.urls]
Homepage = "https://rag.codewithnk.com"
Documentation = "https://github.com/nadeem4/rag-playground/blob/main/docs/pandion.md"
Source = "https://github.com/nadeem4/rag-playground/tree/main/packages/pandion"
Issues = "https://github.com/nadeem4/rag-playground/issues"

[project.scripts]
pandion = "pandion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pandion"]
