template:
  name: Reports with tables
  summary: Reads the page layout, rebuilds each table's rows and columns, and keeps every table whole in one piece.
  good_for: It suits financial reports, data sheets and studies whose answers sit in table rows.
  sample: table-of-figures
index:
  parse:
    use: docling                # a layout model finds each table, its caption and its heading
    do_table_structure: true    # rebuilds rows and columns, so a table reaches the pieces as a markdown table
    table_mode: accurate        # the slower table model, which handles merged and spanning cells better
    do_ocr: false               # these reports have a text layer; for scans use the Scanned PDFs template
    content_layers: [body]      # leaves page headers and footers out, so they never land inside a table's piece
  clean:
    - use: dedupe_blocks        # removes a block repeated word for word, such as a disclaimer on every page
  chunk:
    use: layout_blocks          # cuts along the page's blocks, so a table stays with its caption and heading
    max_tokens: 400             # packs short paragraphs together up to about a long paragraph
    keep_tables_whole: true     # never splits a table: a row cut off from its header row cannot be read
    heading_context: true       # searches each piece with its heading, so a question about a section finds its table
  embed:
    use: qwen3-embedding-0.6b   # the strongest embedder in the catalog, and small enough to run on a CPU
  store:
    use: lancedb
    metric: cosine              # Qwen3's vectors are compared by direction
    build_fts: true             # the keyword index, which the hybrid search in every question template needs
