# An index for pandion: parse, clean, chunk, embed and store.
# Run it with index_samples.py, or read docs/pandion.md for every field.

# Sources, artifacts and the embedding cache are kept here.
# A relative path is read from the folder this file is in.
path: ./index

models:
  download: auto   # "never" loads only models that are already on disk
  device: auto     # or cpu, cuda, mps

index:
  parse:
    use: pdfium
  clean:           # optional; the steps run in order
    - use: dedupe_blocks
  chunk:
    use: recursive_character
    chunk_size: 400
    chunk_overlap: 40
  embed:
    use: qwen3-embedding-0.6b   # index_samples.py --embedder changes this
  store:
    use: lancedb

retrieve:          # what p.retrieve runs; search_samples.py uses it
  rewrite: none    # or {use: llm_rewrite, style: keywords}, with a key
  search:
    use: hybrid_rrf
    top_k: 20
  rerank:          # none, one step, or a list run in order
    - use: mmr
      top_k: 5

answer:            # what p.ask runs after retrieval; ask_samples.py uses it
  use: search      # the pieces found, as they are; or chat, with a key
  top_k: 3
