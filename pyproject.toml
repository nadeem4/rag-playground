[project]
name = "rag-playground"
version = "0.34.0"
description = "A local-first bench for learning and demonstrating RAG by experiment"
requires-python = ">=3.13,<3.14"
dependencies = [
    "anthropic>=1.7.0",
    "fastapi>=0.141.1",
    "openai>=3.17.0",
    # The engine: packages/pandion, installed from this workspace, with the
    # extras for the strategies that have moved into it.
    "pandion[anthropic,docling,lancedb,local,openai,pdfium]",
    # The REST layer over the engine: packages/pandion-api.
    "pandion-api",
    "pillow>=12.3.0",
    "pydantic>=2.9",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    # Listed directly only so the source below applies to them.
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "uvicorn[standard]>=0.53.0",
]

[tool.uv.workspace]
members = ["packages/pandion", "packages/pandion-api"]

# On Linux (the Docker image) take CPU-only torch, not the multi-GB CUDA build.
# Windows and macOS wheels on PyPI are already CPU-only.
[tool.uv.sources]
pandion = { workspace = true }
pandion-api = { workspace = true }
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
rag-playground = "playground.backend.cli:main"

[project.optional-dependencies]
dev = [
    "httpx2>=2.13.0",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    # Computes the next release version and its notes from Conventional Commits (cliff.toml).
    "git-cliff==2.14.2",
]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/pandion/tests", "packages/pandion-api/tests"]
pythonpath = ["packages/pandion/tests"]
markers = [
    "models: requires downloaded ML models (deselected by default)",
    "smoke: real-browser smoke test against a local demo server (deselected by default)",
]
addopts = "-m 'not models and not smoke'"
filterwarnings = [
    # starlette's TestClient names anyio's old BlockingPortal alias; not ours to fix.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["playground"]
