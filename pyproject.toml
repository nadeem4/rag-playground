[project]
name = "rag-playground"
version = "0.2.0"
description = "A local-first bench for learning and demonstrating RAG by experiment"
requires-python = ">=3.13,<3.14"
dependencies = [
    "anthropic>=1.7.0",
    "docling>=2.129.0",
    "fastapi>=0.141.1",
    "lancedb>=0.38,<0.39",
    # Docling's OCR engine. RapidOCR's ONNX checkpoints ship inside its wheel,
    # so OCR downloads nothing; without onnxruntime Docling falls back to
    # RapidOCR's torch backend, which fetches .pth files into site-packages.
    "onnxruntime>=1.30.0",
    "openai>=3.17.0",
    "pillow>=12.3.0",
    "pydantic>=2.9",
    "pypdfium2>=5.13.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.1.0",
    # Listed directly only so the source below applies to them.
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "uvicorn[standard]>=0.53.0",
]

# On Linux (the Docker image) take CPU-only torch, not the multi-GB CUDA build.
# Windows and macOS wheels on PyPI are already CPU-only.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
rag-playground = "api.cli:main"

[project.optional-dependencies]
dev = [
    "httpx2>=2.13.0",
    "pytest>=8.3",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: requires downloaded ML models (deselected by default)"]
addopts = "-m 'not models'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "providers", "plugins", "api"]
