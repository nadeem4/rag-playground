[project]
name = "pandion-api"
version = "0.1.0"
description = "Pandion's public API over HTTP, with one Policy object for a site's rules"
readme = "README.md"
authors = [{ name = "Nadeem Khan" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    # anthropic and openai: the key check (keycheck.py) calls each SDK.
    "pandion[pdfium,anthropic,openai]>=0.8.0,<0.9",
    "fastapi>=0.141.1",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
]
license = "MIT"
keywords = ["retrieval", "rag", "rest", "fastapi", "pandion"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Documentation = "https://github.com/nadeem4/rag-playground/blob/main/docs/pandion-api/index.md"
Source = "https://github.com/nadeem4/rag-playground/tree/main/packages/pandion-api"
Issues = "https://github.com/nadeem4/rag-playground/issues"

[project.optional-dependencies]
# OpenTelemetry spans in serve mode (docs/pandion-api/serve-mode.md, "Logs and traces").
otel = ["opentelemetry-sdk>=1.27", "opentelemetry-exporter-otlp-proto-http>=1.27"]
# Prometheus metrics on their own port in serve mode (docs/pandion-api/serve-mode.md, "Metrics").
metrics = ["prometheus-client>=0.21"]


[tool.uv.sources]
pandion = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pandion_api"]
