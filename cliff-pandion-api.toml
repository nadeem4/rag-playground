# Changelog config for packages/pandion-api/CHANGELOG.md. It copies cliff.toml and differs
# by the header and tag_pattern. pandion-api has no release tags yet, so the pattern
# matches no tag and every commit lands under "Unreleased". cliff.toml drives the release
# version and is never changed for this.
# Regenerate (from the repo root):
#   git-cliff --config cliff-pandion-api.toml --include-path "packages/pandion-api/**" --output packages/pandion-api/CHANGELOG.md

[changelog]
header = """
# Changelog

Notable changes to pandion-api, newest release first, commits oldest first within a release. pandion-api has no release tags yet, so \
everything is under Unreleased. A commit that touches pandion-api and another part also \
appears in that part's changelog.

Generated by git-cliff from Conventional Commit titles. See CONTRIBUTING.md to regenerate it.

"""
body = """
{% if version %}\
## {{ version }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Faster" },
  { message = "^(docs|chore|test|ops|ci|refactor|style|build)", skip = true },
]
tag_pattern = "^pandion-api-v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
