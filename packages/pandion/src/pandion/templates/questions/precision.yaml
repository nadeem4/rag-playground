template:
  name: Best precision
  summary: Hybrid search, then the strongest cross-encoder reads each candidate with the question. It is slower, and it reads much longer pieces than the small reranker. No key needed.
  good_for: It suits single-fact questions, where the one right piece must come first and a slower search is fine.
retrieve:
  rewrite: none                 # searches with the question as typed
  search:
    use: hybrid_rrf             # keyword and meaning search fused by rank, for good recall
    top_k: 30                   # more candidates than usual, because the reranker decides the order
    rrf_k: 60                   # the usual fusion constant
    query_expansion: none       # adds no words to the question
  rerank:
    - use: cross_encoder        # reads the question and each piece together and scores the pair
      model: BAAI/bge-reranker-v2-m3   # the strongest reranker in the catalog; slower on a CPU, and it reads far more of a long piece
      top_k: 5                  # the five pieces shown
answer:
  use: search                   # shows the pieces as they are: no model and no key
  top_k: 5                      # shows every piece the reranker kept
