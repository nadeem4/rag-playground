  <rect x="7" y="8" width="18" height="4" rx="1" fill="#c56e7e"/>
  <rect x="7" y="14" width="11" height="4" rx="1" fill="#3a97c5"/>
  <rect x="7" y="20" width="15" height="4" rx="1" fill="#c07948"/>
</svg>
