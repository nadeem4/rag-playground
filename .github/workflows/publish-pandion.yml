name: Publish pandion

# Publishes the pandion package to PyPI. Only the owner starts it, after an
# explicit yes in chat for that version, by pushing a tag:
#   git tag pandion-v0.1.0 && git push origin pandion-v0.1.0
# In order, stopping at the first that fails:
#   1. Check the tag names the version in packages/pandion/pyproject.toml.
#   2. Build the wheel and the source archive.
#   3. Install that exact wheel in new environments and test it there
#      (checks/pandion-install/run_check.py).
#   4. Upload both files to PyPI. PyPI trusts this workflow by its file name and
#      the `pypi` environment (trusted publishing), so no token is stored here.
#      Do not rename either without changing the publisher on pypi.org.
on:
  push:
    tags: ["pandion-v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - run: uv build packages/pandion --out-dir dist
      - run: >-
          uv run python checks/pandion-install/run_check.py
          --wheel dist/pandion-*.whl --tag "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pandion/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
