    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta name="theme-color" content="#0f6e51" />
    <title>RAG Playground</title>
    <meta name="description" content="Run a RAG pipeline on your own PDF one step at a time, and see where an answer went missing. Free, no sign-in, open source." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RAG Playground" />
    <meta property="og:title" content="RAG Playground: see where your RAG answer went missing" />
    <meta property="og:description" content="Run every step on your own PDF. Change one setting and see what it did. Free, no sign-in, open source." />
    <meta property="og:url" content="https://rag.codewithnk.com" />
    <meta property="og:image" content="https://rag.codewithnk.com/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://rag.codewithnk.com/og-image.png" />
    <script>
      // Apply a pinned theme before first paint. "system" leaves data-theme
      // unset so prefers-color-scheme decides. Storage can throw; ignore it.
      try {
        var t = localStorage.getItem("rag-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        if (localStorage.getItem("rag-contrast") === "more") document.documentElement.dataset.contrast = "more";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
