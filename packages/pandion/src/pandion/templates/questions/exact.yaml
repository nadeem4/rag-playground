template:
  name: Exact terms
  summary: Hybrid search that counts the keyword search twice as much as the meaning search, then a strong cross-encoder. No key needed.
  good_for: It suits questions that name a part number, a product, a person, a code or a clause.
retrieve:
  rewrite: none                 # a rewrite could change the exact term the question names
  search:
    use: hybrid_rrf             # keyword search finds the exact term; meaning search covers the words around it
    top_k: 30                   # more candidates than usual, so a piece only the keyword search finds still reaches the reranker
    rrf_k: 60                   # the usual fusion constant
    dense_weight: 1.0           # the meaning search counts once
    bm25_weight: 2.0            # the keyword search counts twice, so an exact code or name rises above loose matches
    query_expansion: none       # PRF would add words the user did not type, which dilutes an exact name or code
  rerank:
    - use: cross_encoder        # reads the question and each piece together, so it sees the term in context
      model: BAAI/bge-reranker-v2-m3   # the strongest reranker in the catalog; small ones are weaker on rare codes
      top_k: 5                  # the five pieces shown
answer:
  use: search                   # shows the pieces as they are: no model and no key
  top_k: 5                      # shows every piece the reranker kept
