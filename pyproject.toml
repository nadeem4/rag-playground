[project]
name = "rag-playground"
version = "0.1.0"
description = "A local-first bench for learning and demonstrating RAG by experiment"
requires-python = ">=3.13,<3.14"
dependencies = ["pydantic>=2.9"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: requires downloaded ML models (deselected by default)"]
addopts = "-m 'not models'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]
