# Changelog config for the app's CHANGELOG.md. It copies cliff.toml and differs only
# by the header. cliff.toml drives the release version and is never changed for this.
# Regenerate (from the repo root):
#   git-cliff --config cliff-app.toml --output CHANGELOG.md

[changelog]
header = """
# Changelog

Notable changes to the RAG Playground app, newest release first, commits oldest first within a release. Releases are the `v*` tags. \
Pandion has its own changelog in [packages/pandion/CHANGELOG.md](packages/pandion/CHANGELOG.md).

Generated by git-cliff from Conventional Commit titles. See CONTRIBUTING.md to regenerate it.

"""
body = """
{% if version %}\
## {{ version }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Faster" },
  { message = "^(docs|chore|test|ops|ci|refactor|style|build)", skip = true },
]
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
