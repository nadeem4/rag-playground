# Changelog config for packages/pandion/CHANGELOG.md. It copies cliff.toml and differs
# by the header and tag_pattern. cliff.toml drives the release version and is never
# changed for this.
# Regenerate (from the repo root):
#   git-cliff --config cliff-pandion.toml --include-path "packages/pandion/**" --output packages/pandion/CHANGELOG.md

[changelog]
header = """
# Changelog

Notable changes to Pandion, newest release first, commits oldest first within a release. Releases are the `pandion-v*` tags. \
A commit that touches Pandion and another part also appears in that part's changelog.

Generated by git-cliff from Conventional Commit titles. See CONTRIBUTING.md to regenerate it.

"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="pandion-") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Faster" },
  { message = "^(docs|chore|test|ops|ci|refactor|style|build)", skip = true },
]
tag_pattern = "^pandion-v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
