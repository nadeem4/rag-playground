# git-cliff: the next release version and its notes, calculated from
# Conventional Commits (pull request titles, squash-merged). See CONTRIBUTING,
# "Releasing". The version is never chosen by hand.
#
# Before 1.0: a breaking change or a feat bumps the minor number; only fix and
# perf bump the patch. From 1.0: a breaking change bumps the major number.
# Housekeeping (docs, chore, test, ops, ci, refactor, style, build) is left out
# of the notes and on its own makes no release (scripts/next_release.py stops).

[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Faster" },
  { message = "^(docs|chore|test|ops|ci|refactor|style|build)", skip = true },
]
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"

[bump]
features_always_bump_minor = true
breaking_always_bump_major = false
